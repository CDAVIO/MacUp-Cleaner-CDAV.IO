<text x="430.0" y="25" text-anchor="middle" fill="#8a8a8a" style="font-family:-apple-system,Segoe UI,Helvetica,sans-serif;font-size:13px;font-weight:600">Terminal — macup</text>
<clipPath id="c1"><rect class="w1" x="0" y="60" height="22" width="0"/></clipPath><text x="26" y="76" clip-path="url(#c1)"><tspan fill="#ffd905" font-weight="700">$ </tspan><tspan fill="#e8e8e6">macup</tspan></text><text class="l2" x="26" y="118" opacity="0"><tspan fill="#ffd905">  ✦ </tspan><tspan fill="#ffffff" font-weight="700">MacUp</tspan><tspan fill="#8d8e92">  Mac health from the Terminal · free &amp; open source</tspan></text><text class="l3" x="26" y="139" opacity="0"><tspan fill="#8d8e92">  ──────────────────────────────────────────────────────────────</tspan></text><text class="l4" x="26" y="160" opacity="0"><tspan fill="#ffd905">  1  </tspan><tspan fill="#ffffff" font-weight="700">Smart Clean</tspan></text><text class="l5" x="26" y="181" opacity="0"><tspan fill="#8d8e92">     Find hidden caches and move them to the Trash</tspan></text><text class="l6" x="26" y="202" opacity="0"><tspan fill="#ffd905">  2  </tspan><tspan fill="#ffffff" font-weight="700">This Mac</tspan></text><text class="l7" x="26" y="223" opacity="0"><tspan fill="#8d8e92">     Storage, SSD, battery, memory, processor, graphics</tspan></text><text class="l8" x="26" y="244" opacity="0"><tspan fill="#ffd905">  3  </tspan><tspan fill="#ffffff" font-weight="700">Protection</tspan></text><text class="l9" x="26" y="265" opacity="0"><tspan fill="#8d8e92">     Is macOS’s built-in security switched on?</tspan></text><text class="l10" x="26" y="286" opacity="0"><tspan fill="#ffd905">  4  </tspan><tspan fill="#ffffff" font-weight="700">Performance</tspan></text><text class="l11" x="26" y="307" opacity="0"><tspan fill="#8d8e92">     Load, busiest apps, startup items</tspan></text><text class="l12" x="26" y="328" opacity="0"><tspan fill="#ffd905">  5  </tspan><tspan fill="#ffffff" font-weight="700">Complete check</tspan></text><text class="l13" x="26" y="349" opacity="0"><tspan fill="#8d8e92">     Everything + battery health % + PDF report in Downloads</tspan></text><text class="l14" x="26" y="370" opacity="0"><tspan fill="#ffd905">  6  </tspan><tspan fill="#ffffff" font-weight="700">Clear Recent Items</tspan></text><text class="l15" x="26" y="391" opacity="0"><tspan fill="#8d8e92">     Empty the Apple menu’s Recent Items list</tspan></text><text class="l16" x="26" y="412" opacity="0"><tspan fill="#8d8e92">  q  Quit</tspan></text><text class="l17" x="26" y="454" opacity="0"><tspan fill="#ffd905">  › </tspan><tspan fill="#e8e8e6">Choose 1–6 (q to quit): </tspan><tspan fill="#ffd905" font-weight="700">5</tspan></text><text class="l18" x="26" y="76" opacity="0"><tspan fill="#ffd905">  5  </tspan><tspan fill="#ffffff" font-weight="700">Complete check</tspan></text><text class="l19" x="26" y="97" opacity="0"><tspan fill="#8d8e92">  ──────────────────────────────────────────────────────────────</tspan></text><text class="l20" x="26" y="118" opacity="0"><tspan fill="#8d8e92">  Runs every check, shows your battery health % and what needs attention, and saves a PDF report</tspan></text><text class="l21" x="26" y="139" opacity="0"><tspan fill="#8d8e92">  in Downloads.</tspan></text><text class="l22" x="26" y="181" opacity="0"><tspan fill="#ffd905">  ⠋ </tspan><tspan fill="#e8e8e6">Checking your Mac (read-only)…</tspan><tspan fill="#8d8e92">  Storage · Battery · …</tspan></text><text class="l23" x="26" y="202" opacity="0"><tspan fill="#ffffff" font-weight="700">  Battery health  </tspan><tspan fill="#ffd905">██████████████████████</tspan><tspan fill="#3a3a3a">░░</tspan><tspan fill="#ffd905" font-weight="700">  93%</tspan><tspan fill="#8d8e92">  Cycle count: 228</tspan></text><text class="l24" x="26" y="244" opacity="0"><tspan fill="#ffd905">  !  </tspan><tspan fill="#e8e8e6">Storage                      </tspan><tspan fill="#e8e8e6">59.1 GB free (11%)</tspan><tspan fill="#8d8e92">  · Needs attention</tspan></text><text class="l25" x="26" y="265" opacity="0"><tspan fill="#ffd905">  ✓  </tspan><tspan fill="#e8e8e6">SSD health                   </tspan><tspan fill="#e8e8e6">S.M.A.R.T.: Verified</tspan><tspan fill="#8d8e92">  · Good</tspan></text><text class="l26" x="26" y="286" opacity="0"><tspan fill="#ffd905">  ✓  </tspan><tspan fill="#e8e8e6">Battery                      </tspan><tspan fill="#e8e8e6">Health 93% · Cycle count: 228</tspan><tspan fill="#8d8e92">  · Good</tspan></text><text class="l27" x="26" y="307" opacity="0"><tspan fill="#ffd905">  ✓  </tspan><tspan fill="#e8e8e6">Memory (RAM)                 </tspan><tspan fill="#e8e8e6">39% free · 0 GB swap</tspan><tspan fill="#8d8e92">  · Good</tspan></text><text class="l28" x="26" y="328" opacity="0"><tspan fill="#ffd905">  ✓  </tspan><tspan fill="#e8e8e6">Processor                    </tspan><tspan fill="#e8e8e6">18% load · 2 days since restart</tspan><tspan fill="#8d8e92">  · Good</tspan></text><text class="l29" x="26" y="349" opacity="0"><tspan fill="#ffd905">  ✓  </tspan><tspan fill="#e8e8e6">Protection                   </tspan><tspan fill="#e8e8e6">7 of 7 protections on</tspan><tspan fill="#8d8e92">  · Good</tspan></text><text class="l30" x="26" y="370" opacity="0"><tspan fill="#ffd905">  !  </tspan><tspan fill="#e8e8e6">Hidden caches                </tspan><tspan fill="#e8e8e6">3.1 GB</tspan><tspan fill="#8d8e92">  · Needs attention</tspan></text><text class="l31" x="26" y="412" opacity="0"><tspan fill="#ffd905">  →  </tspan><tspan fill="#ffffff" font-weight="700">What to do</tspan></text><text class="l32" x="26" y="433" opacity="0"><tspan fill="#ffd905">  ✕  </tspan><tspan fill="#ffffff" font-weight="700">Low disk space (11% free)</tspan></text><text class="l33" x="26" y="454" opacity="0"><tspan fill="#ffd905">     $ macup clean</tspan></text><text class="l34" x="26" y="496" opacity="0"><tspan fill="#ffd905">  ✓ </tspan><tspan fill="#e8e8e6" font-weight="700">PDF report saved:</tspan></text><text class="l35" x="26" y="517" opacity="0"><tspan fill="#ffd905">     ~/Downloads/MacUp-Health-Report-2026-11-01-1720.pdf</tspan></text>
